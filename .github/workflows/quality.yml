name: Root Quality Gate

on:
  pull_request:
    branches: [Dev]
  push:
    branches:
      - main
      - Dev
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  risk:
    name: Risk Classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_required: ${{ steps.classify.outputs.full_required }}
      ledger_only: ${{ steps.classify.outputs.ledger_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: classify
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            echo 'full_required=true' >> "$GITHUB_OUTPUT"
            echo 'ledger_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/ci/classify_pr_risk.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  ledger:
    name: Change Ledger Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit change ledger coverage
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            python3 scripts/audit_change_release_ledger.py \
              --base '${{ github.event.pull_request.base.sha }}' \
              --head '${{ github.event.pull_request.head.sha }}'
          else
            npm run check:ledger
          fi

  registry:
    name: Regression Registry Audit
    needs: risk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUN_REGISTRY: ${{ github.event_name != 'pull_request' || needs.risk.outputs.ledger_only != 'true' }}

    steps:
      - name: Registry audit not required for a ledger-only pull request
        if: env.RUN_REGISTRY != 'true'
        run: echo 'Ledger-only pull request; Regression Registry Audit has no code surface to inspect.'

      - name: Checkout root repository
        if: env.RUN_REGISTRY == 'true'
        uses: actions/checkout@v4

      - id: mobile-ref
        if: env.RUN_REGISTRY == 'true'
        name: Resolve mobile CI ref
        env:
          MOBILE_CANDIDATE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
        run: |
          resolved_ref="$(bash scripts/ci/resolve_mobile_ci_ref.sh "$MOBILE_CANDIDATE_REF")"
          echo "ref=$resolved_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout mobile repository
        if: env.RUN_REGISTRY == 'true'
        uses: actions/checkout@v4
        with:
          repository: zhishi817/mz-cleaning-app-frontend
          ref: ${{ steps.mobile-ref.outputs.ref }}
          path: mz-cleaning-app-frontend
          fetch-depth: 1

      - name: Audit feature-regression registry
        if: env.RUN_REGISTRY == 'true'
        run: npm run check:feature-registry

  fast:
    name: Fast Regression
    needs: risk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_FAST: ${{ needs.risk.outputs.ledger_only != 'true' }}

    steps:
      - name: Fast regression not required for a ledger-only pull request
        if: env.RUN_FAST != 'true'
        run: echo 'Ledger-only pull request; Fast Regression has no code surface to inspect.'

      - name: Checkout
        if: env.RUN_FAST == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: mobile-ref
        if: env.RUN_FAST == 'true'
        name: Resolve mobile CI ref
        env:
          MOBILE_CANDIDATE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
        run: |
          resolved_ref="$(bash scripts/ci/resolve_mobile_ci_ref.sh "$MOBILE_CANDIDATE_REF")"
          echo "ref=$resolved_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout mobile repository
        if: env.RUN_FAST == 'true'
        uses: actions/checkout@v4
        with:
          repository: zhishi817/mz-cleaning-app-frontend
          ref: ${{ steps.mobile-ref.outputs.ref }}
          path: mz-cleaning-app-frontend
          fetch-depth: 1

      - name: Setup Node
        if: env.RUN_FAST == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mz-cleaning-app-frontend/package-lock.json

      - name: Install backend dependencies
        if: env.RUN_FAST == 'true'
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        if: env.RUN_FAST == 'true'
        run: npm ci --prefix frontend

      - name: Install mobile dependencies
        if: env.RUN_FAST == 'true'
        run: npm ci --prefix mz-cleaning-app-frontend

      - name: Run fast regression
        if: env.RUN_FAST == 'true'
        run: npm run check:ci

  full:
    name: Full Regression
    needs: risk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_FULL: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Full regression deferred until integration
        if: env.RUN_FULL != 'true'
        run: echo 'Pull request accepted by Fast Regression; Full Regression runs on the resulting Dev or main push.'

      - name: Checkout
        if: env.RUN_FULL == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: mobile-ref
        if: env.RUN_FULL == 'true'
        name: Resolve mobile CI ref
        env:
          MOBILE_CANDIDATE_REF: ''
        run: |
          resolved_ref="$(bash scripts/ci/resolve_mobile_ci_ref.sh "$MOBILE_CANDIDATE_REF")"
          echo "ref=$resolved_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout mobile repository
        if: env.RUN_FULL == 'true'
        uses: actions/checkout@v4
        with:
          repository: zhishi817/mz-cleaning-app-frontend
          ref: ${{ steps.mobile-ref.outputs.ref }}
          path: mz-cleaning-app-frontend
          fetch-depth: 1

      - name: Setup Node
        if: env.RUN_FULL == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mz-cleaning-app-frontend/package-lock.json

      - name: Install backend dependencies
        if: env.RUN_FULL == 'true'
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        if: env.RUN_FULL == 'true'
        run: npm ci --prefix frontend

      - name: Install mobile dependencies
        if: env.RUN_FULL == 'true'
        run: npm ci --prefix mz-cleaning-app-frontend

      - name: Run full regression
        if: env.RUN_FULL == 'true'
        run: npm run check:full

  check:
    name: Root Quality Check
    needs: [risk, ledger, registry, fast, full]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all quality layers
        shell: bash
        env:
          RISK_RESULT: ${{ needs.risk.result }}
          LEDGER_RESULT: ${{ needs.ledger.result }}
          REGISTRY_RESULT: ${{ needs.registry.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          failed=0
          for result in "$RISK_RESULT" "$LEDGER_RESULT" "$REGISTRY_RESULT" "$FAST_RESULT" "$FULL_RESULT"; do
            if [[ "$result" != 'success' ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Quality layer failed: risk=$RISK_RESULT ledger=$LEDGER_RESULT registry=$REGISTRY_RESULT fast=$FAST_RESULT full=$FULL_RESULT" >&2
            exit 1
          fi
          echo 'All required quality layers completed successfully.'
