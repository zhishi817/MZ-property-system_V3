name: Quality Check

on:
  pull_request:
  push:
    branches:
      - main
      - Dev
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  fast:
    name: Fast Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit pull request Ledger range
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/audit_change_release_ledger.py \
            --base '${{ github.event.pull_request.base.sha }}' \
            --head '${{ github.event.pull_request.head.sha }}'

      - name: Checkout mobile repository
        uses: actions/checkout@v4
        with:
          repository: zhishi817/mz-cleaning-app-frontend
          ref: Dev
          path: mz-cleaning-app-frontend
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mz-cleaning-app-frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install mobile dependencies
        run: npm ci --prefix mz-cleaning-app-frontend

      - name: Run fast regression
        run: npm run check:ci

  full:
    name: Full Regression
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout mobile repository
        uses: actions/checkout@v4
        with:
          repository: zhishi817/mz-cleaning-app-frontend
          ref: Dev
          path: mz-cleaning-app-frontend
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mz-cleaning-app-frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install mobile dependencies
        run: npm ci --prefix mz-cleaning-app-frontend

      - name: Run full regression
        run: npm run check:full
